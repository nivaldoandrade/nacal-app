<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NaCal" />
    <noscript>
      <style>
        #pwa-splash {
          display: none;
        }
      </style>
    </noscript>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="pwa-zoom-lock-css">
      html.pwa-standalone,
      html.pwa-standalone body {
        touch-action: pan-x pan-y;
      }
    </style>
    <script id="pwa-install-prompt">
      // Captura o prompt nativo de instalação (Chrome/Edge/Android) antes do
      // React montar — o evento pode disparar cedo e não se repete. Lido por
      // src/app/libs/pwaInstall.web.ts.
      (function () {
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          window.__nacalInstallPrompt = event;
          window.dispatchEvent(new Event('nacal:installprompt'));
        });

        window.addEventListener('appinstalled', function () {
          window.__nacalInstallPrompt = null;
          window.dispatchEvent(new Event('nacal:installed'));
        });
      })();
    </script>
    <script id="theme-color-sync">
      (function () {
        function getThemeColorMeta() {
          var meta = document.querySelector('meta[name="theme-color"]');

          if (!meta) {
            meta = document.createElement('meta');
            meta.setAttribute('name', 'theme-color');
            document.head.appendChild(meta);
          }

          return meta;
        }

        var isStandalone = window.matchMedia('(display-mode: standalone)').matches;

        var MAX_ACCEPTED_LIGHTNESS_SUM = 479;

        function toAcceptedThemeColor(color) {
          var channels = color === 'white' ? ['255', '255', '255'] : color.match(/\d+/g);

          if (!channels || channels.length < 3) {
            return color;
          }

          var rgb = channels.slice(0, 3).map(Number);
          var lightnessSum = Math.max(rgb[0], rgb[1], rgb[2]) + Math.min(rgb[0], rgb[1], rgb[2]);
          var excess = Math.ceil((lightnessSum - MAX_ACCEPTED_LIGHTNESS_SUM) / 2);

          if (excess <= 0) {
            return color;
          }

          return 'rgb(' + rgb.map(function (channel) {
            return channel - excess;
          }).join(', ') + ')';
        }

        function syncThemeColor() {
          var color = document.body.style.backgroundColor;

          if (!color) {
            return;
          }

          if (isStandalone) {
            color = toAcceptedThemeColor(color);
          }

          var meta = getThemeColorMeta();

          if (meta.getAttribute('content') !== color) {
            meta.setAttribute('content', color);
          }
        }

        function start() {
          syncThemeColor();

          new MutationObserver(syncThemeColor).observe(document.body, {
            attributes: true,
            attributeFilter: ['style'],
          });
        }

        if (document.body) {
          start();
        } else {
          document.addEventListener('DOMContentLoaded', start);
        }
      })();
    </script>
    <script id="pwa-zoom-lock">
      (function () {
        var isStandalone =
          window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches;

        if (!isStandalone) {
          return;
        }

        document.documentElement.classList.add('pwa-standalone');

        function preventZoom(event) {
          event.preventDefault();
        }

        document.addEventListener('gesturestart', preventZoom, { passive: false });
        document.addEventListener('gesturechange', preventZoom, { passive: false });
        document.addEventListener('gestureend', preventZoom, { passive: false });
      })();
    </script>
    <style id="pwa-splash-css">
      /* Splash de primeiro paint — paridade com a splash nativa (expo-splash-screen).
         O id deste <style> NÃO pode ser "pwa-splash": getElementById retorna o
         primeiro elemento com o id e o remove() do AuthContext precisa apagar o
         <div id="pwa-splash">, não este CSS. */
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d2f676;
      }
      #pwa-splash img {
        /* Mesma caixa do splash nativo iOS (SplashScreen.storyboard: 100x100 pt). */
        width: 100px;
        height: 100px;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- Splash de primeiro paint: some quando o AuthContext fica pronto (appIsReady). -->
    <div id="pwa-splash" aria-hidden="true">
      <img src="/splash-icon.png" alt="" draggable="false" />
    </div>
  </body>
</html>
